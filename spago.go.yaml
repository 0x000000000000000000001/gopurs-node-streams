package:
  name: node-streams
  publish:
    license: MIT
    version: 9.0.1
    location:
      githubOwner: purescript-node
      githubRepo: purescript-node-streams
  dependencies:
    - aff: ">=7.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.0.0 <7.0.0"
    - exceptions: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - node-buffer: ">=9.0.0 <10.0.0"
    - node-event-emitter: ">=3.0.0 <4.0.0"
    - nullable: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
    - st: ">=6.2.0 <7.0.0"
    - tailrec: ">=6.1.0 <7.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    # See also other tests
    #
    #     spago test --main Test.Main1
    #     spago test --main Test.Main2
    #     spago test --main Test.Main3 -- <(head --bytes 1000000 /dev/zero)
    #     spago test --main Test.Main4
    #
    dependencies:
      - assert
      - console
      - partial
      - spec

workspace:
  packageSet:
    registry: 77.7.0
  extraPackages:
    aff:
      path: "../gopurs-aff"
    arrays:
      path: "../gopurs-arrays"
    assert:
      path: "../gopurs-assert"
    avar:
      path: "../gopurs-avar"
    catenable-lists:
      path: "../gopurs-catenable-lists"
    console:
      path: "../gopurs-console"
    datetime:
      path: "../gopurs-datetime"
    effect:
      path: "../gopurs-effect"
    enums:
      path: "../gopurs-enums"
    exceptions:
      path: "../gopurs-exceptions"
    foldable-traversable:
      path: "../gopurs-foldable-traversable"
    foreign:
      path: "../gopurs-foreign"
    functions:
      path: "../gopurs-functions"
    integers:
      path: "../gopurs-integers"
    lazy:
      path: "../gopurs-lazy"
    node-event-emitter:
      path: "../gopurs-node-event-emitter"
    now:
      path: "../gopurs-now"
    nullable:
      path: "../gopurs-nullable"
    numbers:
      path: "../gopurs-numbers"
    partial:
      path: "../gopurs-partial"
    prelude:
      path: "../gopurs-prelude"
    refs:
      path: "../gopurs-refs"
    spec:
      path: "../gopurs-spec"
    st:
      path: "../gopurs-st"
    strings:
      path: "../gopurs-strings"
    unfoldable:
      path: "../gopurs-unfoldable"
    unsafe-coerce:
      path: "../gopurs-unsafe-coerce"
